name: Docker CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  DOCKER_IMAGE: umangprajapati/portfolio

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Build & Push Docker Image to Hub
  # ─────────────────────────────────────────
  build-and-push:
    name: Build & Push to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: umangprajapati
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t ${{ env.DOCKER_IMAGE }}:latest .

      - name: Push Docker image to Docker Hub
        run: docker push ${{ env.DOCKER_IMAGE }}:latest

  # ─────────────────────────────────────────
  # JOB 2: Deploy Docker Container on EC2
  # ─────────────────────────────────────────
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build-and-push   # Only runs after successful build & push

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Pull the latest image from Docker Hub
            docker pull umangprajapati/portfolio:latest

            # Stop & remove old container (ignore error if not running)
            docker stop portfolio-container || true
            docker rm   portfolio-container || true

            # Run new container on port 80
            docker run -d \
              --name portfolio-container \
              -p 80:80 \
              --restart unless-stopped \
              umangprajapati/portfolio:latest

            # Remove dangling/unused images to save disk space
            docker image prune -f

            echo "✅ Deployment complete! Visit http://${{ secrets.EC2_HOST }}"
